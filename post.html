<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обзор игры</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .post-container { max-width: 800px; margin: 40px auto; padding: 20px; background: #1a1d29; border-radius: 12px; border: 1px solid #2a2e3d; }
    .post-container img { width: 100%; border-radius: 8px; margin-bottom: 20px; }
    .post-container h1 { margin-bottom: 20px; font-size: 2rem; color: #fff; }
    .post-body { line-height: 1.8; font-size: 1.1rem; color: #ccc; }
    .post-body p { margin-bottom: 15px; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #6c3ce0; text-decoration: none; font-weight: bold; }
    .back-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="header">
    <h1>🎮 GameReviews</h1>
  </header>

  <main>
    <div class="post-container" id="post-content">
      <p>Загрузка...</p>
    </div>
  </main>

  <script src="script-post.js"></script>
</body>
</html>
