<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameReviews — Честные обзоры игр</title>
  <meta name="description" content="Честные обзоры популярных и инди-игр. Оценки, скриншоты, геймплей и личное мнение автора.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="theme-switcher">
      <button class="theme-btn" onclick="toggleThemeMenu()">Темы</button>
      <div class="theme-menu" id="themeMenu">
        <button onclick="setTheme('dark')">Тёмная</button>
        <button onclick="setTheme('light')">Светлая</button>
        <button onclick="setTheme('lavender')">Лаванда</button>
        <button onclick="setTheme('mint')">Мята</button>
        <button onclick="setTheme('cyberpunk')">Киберпанк</button>
      </div>
    </div>
    <h1>GameReviews</h1>
    <p>Честные обзоры игр</p>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Поиск игры..." autocomplete="off">
    </div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-genre="all">Все</button>
      <button class="filter-btn" data-genre="shooter">Шутеры</button>
      <button class="filter-btn" data-genre="moba">MOBA</button>
      <button class="filter-btn" data-genre="rpg">RPG</button>
      <button class="filter-btn" data-genre="sandbox">Песочницы</button>
    </div>

    <button class="suggest-btn" onclick="openSuggestModal()">Предложить игру</button>
  </header>

  <main>
    <section class="reviews" id="reviews">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 GameReviews</p>
  </footer>

  <button id="scrollTopBtn" class="scroll-top" onclick="scrollToTop()">↑</button>

  <!-- МОДАЛЬНОЕ ОКНО ПРЕДЛОЖКИ -->
  <div id="suggestModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeSuggestModal()">&times;</span>
      <h2>Предложить игру</h2>
      <p>Знаешь игру, про которую стоит написать обзор? Напиши её название ниже.</p>
      
      <input type="text" id="suggestGameName" placeholder="Название игры" autocomplete="off">
      <textarea id="suggestReason" placeholder="Почему стоит сделать обзор? (необязательно)"></textarea>
      
      <button class="submit-suggest-btn" onclick="sendSuggestion()">Отправить в Telegram</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
