<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameReviews — Честные обзоры игр</title>
  <meta name="description" content="Честные обзоры игр. Оценки, скриншоты и личное мнение.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="theme-switcher">
      <button class="theme-btn" onclick="toggleThemeMenu()">Темы</button>
      <div class="theme-menu" id="themeMenu">
        <button onclick="setTheme('dark')">Тёмная</button>
        <button onclick="setTheme('light')">Светлая</button>
        <button onclick="setTheme('lavender')">Лаванда</button>
        <button onclick="setTheme('mint')">Мята</button>
        <button onclick="setTheme('cyberpunk')">Киберпанк</button>
      </div>
    </div>
    <h1>GameReviews</h1>
    <p>Честные обзоры игр</p>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Поиск игры..." autocomplete="off">
    </div>

    <!-- Контейнер для главных кнопок (заполняется JS) -->
    <div class="filters" id="filters-main">
      <!-- Сюда JS вставит 4 кнопки -->
    </div>
    
    <!-- Контейнер для кнопки "Ещё" и выпадающего списка (заполняется JS) -->
    <div class="filters-more-container" id="filters-more">
      <!-- Сюда JS вставит кнопку "Ещё..." -->
    </div>

    <button class="suggest-btn" onclick="openSuggestModal()">Предложить игру</button>
  </header>

  <main>
    <section class="reviews" id="reviews">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 GameReviews</p>
  </footer>

  <button id="scrollTopBtn" class="scroll-top" onclick="scrollToTop()">↑</button>

  <div id="suggestModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeSuggestModal()">&times;</span>
      <h2>Предложить игру</h2>
      <p>Напиши название игры, которую стоит обозреть.</p>
      <form id="suggestForm">
        <input type="text" name="game" id="suggestGameName" placeholder="Название игры" required autocomplete="off">
        <textarea name="reason" id="suggestReason" placeholder="Почему стоит сделать обзор? (необязательно)"></textarea>
        <button type="submit" class="submit-suggest-btn">Отправить</button>
      </form>
      <div id="formStatus" style="margin-top: 10px; text-align: center; font-weight: bold;"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
